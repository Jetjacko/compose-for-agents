version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: delivery-tracking-db
    environment:
      POSTGRES_USER: ${DB_USER:-deliveryapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword}
      POSTGRES_DB: ${DB_NAME:-delivery_tracking}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-deliveryapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-tracking-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-deliveryapp}
      DB_PASSWORD: ${DB_PASSWORD:-securepassword}
      DB_NAME: ${DB_NAME:-delivery_tracking}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      MAIL_SERVICE: ${MAIL_SERVICE:-gmail}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - delivery-network
    command: npm run dev

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery-tracking-frontend
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_WS_URL: ws://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - delivery-network
    command: npm start

  # Redis for real-time features and caching
  redis:
    image: redis:7-alpine
    container_name: delivery-tracking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - delivery-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: delivery-tracking-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - delivery-network

volumes:
  postgres_data:
  redis_data:

networks:
  delivery-network:
    driver: bridge
